[package]
name = "purrassist-syntax"
autoexamples = false
description = "Syntax adapters for intent-aware source editing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["ai", "json", "recovery", "matching", "agents"]
categories = ["parsing", "text-processing"]
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/purrassist-syntax"

[lints]
workspace = true

[[example]]
name = "portable-syntax"
path = "examples/portable.rs"

[dependencies]
purrassist-core.workspace = true
tree-sitter = { version = "=0.27.0", default-features = false }
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
