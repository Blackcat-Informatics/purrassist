[package]
name = "purrassist-core"
autoexamples = false
description = "Pure intent recovery engines and auditable assistance contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["ai", "json", "recovery", "matching", "agents"]
categories = ["parsing", "text-processing"]
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/purrassist-core"

[lints]
workspace = true

[dependencies]

[[example]]
name = "fuzz-json"
path = "examples/fuzz_json.rs"

[[example]]
name = "fuzz-markdown"
path = "examples/fuzz_markdown.rs"
test = true

[[example]]
name = "fuzz-schema"
path = "examples/fuzz_schema.rs"

[[example]]
name = "fuzz-pattern"
path = "examples/fuzz_pattern.rs"

[[example]]
name = "fuzz-unified"
path = "examples/fuzz_unified.rs"

[[example]]
name = "fuzz-fuzzy"
path = "examples/fuzz_fuzzy.rs"

[[example]]
name = "fuzz-matching"
path = "examples/fuzz_matching.rs"

[[example]]
name = "fuzz-patch"
path = "examples/fuzz_patch.rs"

[[example]]
name = "fuzz-tool-call"
path = "examples/fuzz_tool_call.rs"
test = true

[[example]]
name = "tool-call-corpus"
path = "examples/tool_call_corpus.rs"

[[example]]
name = "wire-declarations"
path = "examples/wire_declarations.rs"

# Corpus suites: vendored conformance corpora, generated evaluation corpora,
# exhaustive oracles and 1 MiB scale runs. `make corpus` (the CI `corpus`
# job) runs them; `test = false` keeps them out of `cargo test` and `make check`.
# `make lint` still lints them through `CORPUS_SUITES` in the Makefile, which
# `scripts/check-release.py` holds equal to the `test = false` targets below.
[[test]]
name = "correction_evaluation"
path = "tests/correction_evaluation.rs"
test = false

[[test]]
name = "corruption_oracle"
path = "tests/corruption_oracle.rs"
test = false

[[test]]
name = "markdown_corpus"
path = "tests/markdown_corpus.rs"
test = false

[[test]]
name = "matching_oracle"
path = "tests/matching_oracle.rs"
test = false

[[test]]
name = "pattern_corpus"
path = "tests/pattern_corpus.rs"
test = false

[[test]]
name = "schema_conformance"
path = "tests/schema_conformance.rs"
test = false

[[test]]
name = "tool_call_scale"
path = "tests/tool_call_scale.rs"
test = false

[[test]]
name = "unicode_conformance"
path = "tests/unicode_conformance.rs"
test = false

[[bench]]
name = "recovery"
harness = false

[[bench]]
name = "resources"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "tool_calls"
harness = false

[[example]]
name = "canonical_print"
path = "examples/canonical_print.rs"

[[example]]
name = "grammar-bounds"
path = "examples/grammar_bounds.rs"
