[package]
name = "purrassist-core"
autoexamples = false
description = "Pure intent recovery engines and auditable assistance contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["ai", "json", "recovery", "matching", "agents"]
categories = ["parsing", "text-processing"]
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/purrassist-core"

[lints]
workspace = true

[dependencies]

[[example]]
name = "portable-core"
path = "examples/portable.rs"

[[example]]
name = "fuzz-json"
path = "examples/fuzz_json.rs"

[[example]]
name = "fuzz-markdown"
path = "examples/fuzz_markdown.rs"
test = true

[[example]]
name = "fuzz-schema"
path = "examples/fuzz_schema.rs"

[[example]]
name = "fuzz-pattern"
path = "examples/fuzz_pattern.rs"

[[example]]
name = "fuzz-unified"
path = "examples/fuzz_unified.rs"

[[example]]
name = "fuzz-fuzzy"
path = "examples/fuzz_fuzzy.rs"

[[example]]
name = "fuzz-matching"
path = "examples/fuzz_matching.rs"

[[example]]
name = "fuzz-patch"
path = "examples/fuzz_patch.rs"

[[bench]]
name = "recovery"
harness = false

[[bench]]
name = "resources"
harness = false

[[bench]]
name = "latency"
harness = false
