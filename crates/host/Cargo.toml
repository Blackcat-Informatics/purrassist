[package]
name = "purrassist-host"
autoexamples = false
description = "Native filesystem and helper integration for PurRAssist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["ai", "json", "recovery", "agents", "mcp"]
categories = ["parsing", "text-processing"]
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/purrassist-host"

[lints]
workspace = true

[[example]]
name = "portable-host"
path = "examples/portable.rs"

[dependencies]
purrassist.workspace = true

# Windows-only durable-replace/rename primitives (`crates/host/src/files/windows.rs`);
# see docs/DEPENDENCIES.md for the registration and unsafe_code exception rationale.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }
