          C407 470 407 527 386 555
          C365 527 365 470 386 442 Z"/>
        <path id="right-pupil" class="cat" d="
          M638 442
          C659 470 659 527 638 555
          C617 527 617 470 638 442 Z"/>
        <path id="left-eye-spark" class="feature" d="M396 461 C404 474 403 493 396 508 C386 493 387 474 396 461 Z"/>
        <path id="right-eye-spark" class="feature" d="M648 461 C656 474 655 493 648 508 C638 493 639 474 648 461 Z"/>

        <path id="left-brow" class="feature-stroke" stroke-width="9" d="M307 422 C358 397 432 405 474 447"/>
        <path id="right-brow" class="feature-stroke" stroke-width="9" d="M717 422 C666 397 592 405 550 447"/>

        <path id="nose" class="feature" d="
          M475 570
          C491 558 533 558 549 570
          C544 586 528 601 512 614
          C496 601 480 586 475 570 Z"/>

        <g id="whiskers" stroke-width="7">
          <path class="feature-stroke" d="M226 552 C293 541 354 546 409 566"/>
          <path class="feature-stroke" d="M236 585 C301 572 361 578 416 599"/>
          <path class="feature-stroke" d="M798 552 C731 541 670 546 615 566"/>
          <path class="feature-stroke" d="M788 585 C723 572 663 578 608 599"/>
        </g>
      </g>

      <g id="service-repair">
        <rect x="324" y="655" width="376" height="220" rx="28" fill="#fffdf5" stroke="#111214" stroke-width="8"/>
        <path d="M424 696 h-14 q-18 0-18 20 v23 q0 20-22 20 q22 0 22 20 v23 q0 20 18 20 h14" fill="none" stroke="#4285f4" stroke-width="13" stroke-linecap="round"/>
        <path d="M600 696 h14 q18 0 18 20 v23 q0 20 22 20 q-22 0-22 20 v23 q0 20-18 20 h-14" fill="none" stroke="#4285f4" stroke-width="13" stroke-linecap="round"/>
        <path d="M459 758 l34 34 69-76" fill="none" stroke="#34a853" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="563" cy="831" r="9" fill="#fbbc05"/>
        <path d="M455 833 h43" fill="none" stroke="#ea4335" stroke-width="8" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g id="text" font-family="Noto Sans">
    <text x="540" y="268" font-size="112" font-weight="700" fill="#fffdf5">Pur<tspan fill="#4285f4">RA</tspan>ssist</text>
    <g id="accent">
      <rect x="544" y="298" width="64" height="8" rx="4" fill="#ea4335"/>
      <rect x="620" y="298" width="64" height="8" rx="4" fill="#4285f4"/>
      <rect x="696" y="298" width="64" height="8" rx="4" fill="#fbbc05"/>
      <rect x="772" y="298" width="64" height="8" rx="4" fill="#34a853"/>
    </g>
    <text x="540" y="378" font-size="38" fill="#fffdf5">Assistance for AIs that get</text>
    <text x="540" y="428" font-size="38" fill="#fffdf5">the details almost right.</text>
    <rect x="540" y="472" width="560" height="64" rx="32" fill="#fffdf5" fill-opacity="0.08" stroke="#34a853" stroke-width="2"/>
    <text x="820" y="514" font-size="28" font-weight="700" fill="#fffdf5" text-anchor="middle">Rust crate · MCP server · CLI</text>
  </g>
</svg>
