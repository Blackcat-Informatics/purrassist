[[distinct]]
kind = "shim"
members = ["purrassist_core::grammar::GrammarError::from", "purrassist_core::grammar::print::PrintError::from", "purrassist_core::json::parser::ParseFailure::from", "purrassist_core::pattern::PatternCompileError::from", "purrassist_core::schema::build::CompilationError::from", "purrassist_core::tool_call::dialect::DialectSetError::from", "purrassist_core::tool_call::emit::EmitError::from", "purrassist_toolgraph::apparmor_glob::GlobError::from", "purrassist_toolgraph::field_mask::FieldMaskError::from"]
criterion = "a"
anchor = "purrassist_core::json::parser::ParseFailure"
reason = "Distinct public nominal error types for JSON parsing, pattern compilation, schema compilation, grammar compilation, grammar production printing (shared by witness generation), tool-call emission, dialect-set compilation, AppArmor glob admission and tool-graph context-mask parsing. Glob admission additionally distinguishes source syntax, declarations and literal bindings. Each From<StopReason> preserves the exact reason in its own Resource variant; merging the variants would change the public result contract."

[[distinct]]
kind = "body"
members = ["purrassist_core::json::number::NumberParseError::fmt", "purrassist_core::pattern::PatternCompileError::fmt"]
criterion = "a"
anchor = "purrassist_core::json::number::NumberParseError"
reason = "Distinct public nominal syntax/resource result contracts: NumberParseError carries NumberError for RFC 8259 numeric spelling, while PatternCompileError carries source-addressed ECMA-262 PatternError diagnostics. Each standard Display implementation delegates to its own typed inner error. This is error presentation, not a second validation or resource implementation; merging the public types would alter their syntax variants and caller error contracts."

[[distinct]]
kind = "shim"
members = ["purrassist_core::tool_call::derive_support::Box::parameter", "purrassist_core::tool_call::derive_support::Option::parameter"]
criterion = "a"
anchor = "purrassist_core::tool_call::ToolParameter"
reason = "Distinct public wrapper types with a specified conformance difference: Option<T> shares the parameter shape of T but is the only not-required parameter (REQUIRED false, absent Some(None)), while Box<T> is exactly T (REQUIRED, absent and DEPTH forward). Each is an impl of the documented ToolParameter trait for its own type, whose parameter() is the item both forward to; a trait impl cannot share a body across Self types, and the differing associated items in the same impls are the contract."
