criterion = "a"
anchor = "purrassist_core::tool_call::ToolParameter"
reason = "Distinct public wrapper types with a specified conformance difference: Option<T> shares the parameter shape of T but is the only not-required parameter (REQUIRED false, absent Some(None)), while Box<T> is exactly T (REQUIRED, absent and DEPTH forward). Each is an impl of the documented ToolParameter trait for its own type, whose parameter() is the item both forward to; a trait impl cannot share a body across Self types, and the differing associated items in the same impls are the contract."
