[[distinct]]
kind = "shim"
members = ["purrassist_core::grammar::GrammarError::from", "purrassist_core::grammar::print::PrintError::from", "purrassist_core::grammar::print::ScratchPrintError::from", "purrassist_core::json::parser::ParseFailure::from", "purrassist_core::json::parser::OwnedParseFailure::from", "purrassist_core::pattern::PatternCompileError::from", "purrassist_core::pattern::bytes::ByteCompileError::from", "purrassist_core::schema::build::CompilationError::from", "purrassist_core::schema::reference::Error::from", "purrassist_core::tool_call::dialect::DialectSetError::from", "purrassist_core::tool_call::emit::EmitError::from", "purrassist_toolgraph::apparmor_glob::GlobError::from", "purrassist_core::output::project::ProjectionFailure::from", "purrassist_core::output::field_mask::FieldMaskError::from", "purrassist_toolgraph::policy_document::PolicyCause::from", "purrassist_toolgraph::policy_trust::PolicyTrustCause::from", "purrassist_toolgraph::prompt_bytes::PromptByteFailure::from", "purrassist_toolgraph::prompt_tokens::TokenCountError::from"]
criterion = "a"
anchor = "purrassist_core::json::parser::ParseFailure"
reason = "Distinct nominal error types for JSON parsing, Unicode pattern compilation, direct byte-program compilation, schema compilation, grammar compilation, grammar production printing (shared by witness generation), tool-call emission, dialect-set compilation, AppArmor glob admission and tool-graph context-mask parsing. Byte-program compilation reports instruction arity and root-count errors independently of Unicode source-pattern syntax. Glob admission additionally distinguishes source syntax, declarations and literal bindings. The internal canonical printing error additionally retains exact scratch-owned diagnostics until publication, while the public printing error publishes owned strings. Prepared framed-prompt errors additionally retain original borrowed identities and distinguish exact byte-ceiling and checked-sizing refusals from native governor failures. Validated result projection additionally distinguishes schema, selected-member type and ambiguity, and exact output-limit refusals while retaining the original result and full stage evidence. Policy document compilation additionally retains original complete input and exact native rule causes, with document-specific duplicate, HOME and ABI refusals. Prepared policy trust additionally distinguishes exact authority, source-table closure, duplicate grants and checked transcript framing while retaining original request, registry, scope and usage; its nominal resource conversion preserves native causes without creating a partial matched handle. Exact prompt counters additionally distinguish unavailable accounting from native resource refusal without substituting a zero count. Internal schema reference errors retain scratch-owned locations until compiler or runtime publication chooses its distinct diagnostic representation. Internal strict JSON parsing retains allocation-free syntax descriptors until the final JSON or schema diagnostic boundary. Each From<StopReason> preserves the exact reason in its own Resource variant; merging these nominal contracts would change public errors or move transient storage across the wrong publication boundary."

