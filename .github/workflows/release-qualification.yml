name: Release qualification
on:
  push:
    tags: ['rust-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install release toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Verify release set and version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/check-release.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check-release.py
          fi
      - name: Verify workspace
        run: make check
      - name: Verify crate archives and notices
        run: make package
