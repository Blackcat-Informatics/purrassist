#
# Qualification only: never publishes, never attests, never creates a GitHub
# release, and holds no crates.io credential or OIDC permission. It proves
# the tag matches the workspace version and dependency order, runs the full
# local gate on stable Rust, and audits the packaged archives and license
# notices. publish.yml is the only workflow that publishes, and it requires a
# successful run of this workflow for the same commit before it does.
name: Release qualification
on:
  push:
    tags: ['rust-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install release toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Install pinned coverage-feedback toolchain
        # The workspace gate remains stable; the isolated coverage probe
        # uses its registered nightly compiler and matching LLVM tools.
        run: rustup toolchain install nightly-2026-09-14 --profile minimal --component llvm-tools
      - name: Verify release set and version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/check-release.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check-release.py
          fi
      - name: Verify workspace
        run: make check
      - name: Verify corpus suites
        run: make corpus
      - name: Verify coverage-feedback corpus growth
        run: python3 scripts/test-fuzz-feedback.py
      - name: Verify the published-crate verifier
        run: python3 scripts/test-verify-published.py
      - name: Verify crate archives and notices
        run: make package
