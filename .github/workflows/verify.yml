name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-09-14 --profile minimal --component clippy,rustfmt,llvm-tools
      - run: make check
      - name: Test release workflow validation and publish preflight offline
        run: python3 scripts/test-check-release.py
      - name: Replay committed CLI/MCP transcripts against the built CLI
        run: python3 scripts/test-verify-published.py
      - if: runner.os == 'Linux'
        name: Install pinned Node for independent syntax oracles
        run: python3 scripts/install-qualification-tool.py node >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: make syntax-oracles
  release-gate:
    # The release gate on the release toolchain (stable 1.98.0, which is also
    # the MSRV evidence), with the pinned nightly for the coverage probe: the
    # same `make release-gate` that release qualification runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - run: rustup toolchain install nightly-2026-09-14 --profile minimal --component llvm-tools
      - run: make release-gate
  windows-engines:
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo test -p purrassist-core -p purrassist-syntax --locked
      - run: cargo test -p purrassist-derive -p purrassist --locked
      - run: cargo test -p purrassist-host -p purrassist-cli --locked
      - run: rustup component add clippy
      - run: cargo clippy -p purrassist-host -p purrassist-cli --all-targets --locked -- -D warnings
  wasm:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-09-14 --profile minimal --target wasm32-wasip1,wasm32-unknown-unknown
      - name: Install pinned Node for WASM execution
        run: python3 scripts/install-qualification-tool.py node >> "$GITHUB_PATH"
      - run: make wasm-test
  corpus:
    # Vendored conformance corpora, generated evaluation corpora, exhaustive
    # oracles and 1 MiB scale runs (`test = false` suites; not in make check).
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-09-14 --profile minimal
      - run: make corpus
  fuzz:
    # Coverage-guided and differential fuzzing, with the corpus-feedback
    # self-test; not in make check.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # llvm-tools provides the llvm-cov/llvm-profdata build of this exact
      # nightly's own LLVM revision, which scripts/fuzz.py resolves via
      # `rustc --print sysroot` (see vendor/tooling.json's llvm-coverage entry).
      - run: rustup toolchain install nightly-2026-09-14 --profile minimal --component llvm-tools
      # The pattern target's differential oracle runs Node, and scripts/fuzz.py
      # requires the version pinned in vendor/tooling.json.
      - name: Install pinned Node for the pattern differential oracle
        run: python3 scripts/install-qualification-tool.py node >> "$GITHUB_PATH"
      - name: Coverage-guided and differential fuzzing (smoke counts)
        # All ten targets, 1,000 mutations each, with the accepted issue #6
        # and #11 limitations handled as docs/RELEASE.md describes.
        run: make fuzz-hosted
  qualification:
    # Independent oracles, archive audits, and fresh resource measurements
    # for this exact branch head.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-09-14 --profile minimal --target wasm32-wasip1,wasm32-unknown-unknown
      - name: Install pinned Node for independent oracles
        run: python3 scripts/install-qualification-tool.py node >> "$GITHUB_PATH"
      - name: Install pinned Valgrind for resource measurement
        run: python3 scripts/install-qualification-tool.py valgrind >> "$GITHUB_PATH"
      - name: Install archive extractor for the pinned profiling runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libarchive-tools
          dpkg-query --show --showformat='${Package} ${Version}\n' libarchive-tools
          bsdtar --version
      - name: Check profiler startup and diagnostics before qualification campaigns
        run: python3 scripts/measure-resources.py --portable-runtime --check-tools
      - name: Independent syntax oracles
        run: make syntax-oracles
      - name: Package crate archives and notices
        run: make package
      - name: Measure resources
        run: make resources RESOURCE_ARGS=--portable-runtime
      - name: Check resource limits
        run: python3 scripts/check-resource-limits.py .cache/resource-report.json
